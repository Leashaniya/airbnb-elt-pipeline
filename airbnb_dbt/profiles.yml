# Connection settings. Values come from environment variables (loaded from .env),
# so no credentials are stored in this file.
airbnb:
  target: dev
  outputs:
    dev:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('SNOWFLAKE_USER') }}"
      password: "{{ env_var('SNOWFLAKE_PASSWORD') }}"
      role: "{{ env_var('SNOWFLAKE_ROLE', 'ACCOUNTADMIN') }}"
      warehouse: "{{ env_var('SNOWFLAKE_WAREHOUSE', 'AIRBNB_WH') }}"
      database: "{{ env_var('SNOWFLAKE_DATABASE', 'AIRBNB') }}"
      schema: dbt
      threads: 4
